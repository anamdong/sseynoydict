<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hoe'im Tíhỳ 胡音體系 | 字から音</title>
  <link rel="stylesheet" href="./site.css?v=20260829g" />
</head>
<body>
<div class="appShell">
  <header class="globalHeader">
    <a class="brand" href="./index.html"><span>Hoe'im Tíhỳ</span><span class="brandScript">胡音體系</span></a>
    <nav class="siteTabs" aria-label="Section navigation">
      <a class="siteTab current" href="./index.html">字から音</a>
      <a class="siteTab" href="./sound-search.html">音から字</a>
      <a class="siteTab" href="./mc-tools.html">聲韻検索</a>
      <a class="siteTab" href="./text-reader.html">文章読音</a>
    </nav>
  </header>

  <main class="workspace">
  <section class="toolCard">
    <section class="toolDemo" data-tool-demo="char" aria-label="字から音の例">
      <h1 class="visuallyHidden">漢字から読音を引く</h1>
      <div class="toolDemoTrack" aria-hidden="true">
        <div class="toolDemoPart"><span class="toolDemoKicker">字</span><span class="toolDemoValue toolDemoInput" data-demo-input></span></div>
        <span class="toolDemoArrow">→</span>
        <div class="toolDemoPart"><span class="toolDemoKicker">音</span><span class="toolDemoValue toolDemoOutput" data-demo-output></span></div>
      </div>
      <details class="infoToggle">
        <summary aria-label="このページと使い方"><span class="infoIcon" aria-hidden="true">ⓘ</span></summary>
        <div class="infoPanel">
          <div class="infoLine">同じ辞書を使って、字から音、音から字、聲韻検索、文章読音を切り替えながら確認できます。</div>
          <div class="infoLine">複数字をまとめて検索して、読音と中古音情報を一件ずつ確認できます。</div>
        </div>
      </details>
    </section>

    <div class="filterPanel searchPanel">
      <div class="sectionHeaderRow sectionHeaderRowLabel">
        <div class="sectionLabel">検索</div>
        <details class="infoToggle">
          <summary aria-label="検索ヒント"><span class="infoIcon" aria-hidden="true">ⓘ</span></summary>
          <div class="infoPanel">同一字に複数音があればリスト表示します。異体字・日本字形・簡体字でも検索できます。</div>
        </details>
      </div>
      <div class="row">
        <label class="searchField">
          <svg class="searchFieldIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <input id="q" type="text" aria-label="検索する漢字" placeholder="漢字を入力（複数OK）例：東同中蟲…" autocomplete="off" />
        </label>
        <button id="searchBtn" class="btnAccent">検索</button>
        <button id="demoBtn" class="btnSecondary">デモ</button>
      </div>
    </div>

    <div id="status" class="status warn">辞書を自動読み込み中…</div>

    <div id="resultsArea" class="resultsArea" hidden>
      <div class="sectionLabel">検索結果</div>
      <div id="out" class="out"></div>
    </div>
  </section>
  </main>
</div>

<script src="./Kuankhiunn0704.txt.js?v=20260331a"></script>
<script src="./frequency-reading-overrides.js?v=20260901f"></script>
<script src="./dictionary-core.js?v=20260902a"></script>
<script src="./tool-demo-terms.js?v=20260901c"></script>
<script src="./tool-demos.js?v=20260901a"></script>
<script>
const core = window.HuDictionaryCore;
let dictionary = null;
const DEFAULT_SOURCE_URL = `./${core.LOCAL_SOURCE_NAME}`;

function setStatus(msg, kind = "warn"){
  const el = document.getElementById("status");
  el.className = `status ${kind}`;
  if (kind === "ok") {
    el.innerHTML = `
      <span class="statusContent">
        <span class="statusCheck" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <circle class="statusCheckCircle" cx="12" cy="12" r="10"></circle>
            <path class="statusCheckMark" d="M7.6 12.3l3 3.1 5.8-6.2"></path>
          </svg>
        </span>
        <span class="statusText">${core.escapeHtml(msg)}</span>
      </span>
    `;
    return;
  }
  el.textContent = msg;
}

function renderCharEntry(entry, index){
  const isPure = entry.readingType === core.READING_TYPE_PURE;
  const displayedReading = typeof entry.reading === "string" && entry.reading ? entry.reading : (entry.conv?.ok ? entry.conv.reading : "（変換エラー）");
  const div = document.createElement("div");
  div.className = isPure ? "entry entryPure" : "entry";

  if (isPure) {
    div.innerHTML = `
      <div class="entryHeader">
        <span class="tag tagPure">#${core.escapeHtml(entry.readingLabel || core.PURE_READING_LABEL)}</span>
      </div>
      <div class="reading readingPure mono">${core.escapeHtml(entry.reading)}</div>
    `;
    return div;
  }

  div.innerHTML = `
    <div class="entryHeader">
      <span class="tag">#${index + 1}</span>
      <span class="tag">小韻：${core.escapeHtml(entry.xiaoyun)}</span>
      <span class="tag">中古：${core.escapeHtml(entry.mc.initialMu)} + ${core.escapeHtml(entry.mc.rimeKey)}（${core.escapeHtml(entry.mc.tone)}）</span>
    </div>
    <div class="reading mono">${core.escapeHtml(displayedReading)}</div>
    <div class="small mono">${core.escapeHtml(entry.conv.ok ? `init=${entry.conv.debug.initialRoman || "∅"} / rime=${entry.conv.debug.rimeRoman} / 乙類=${entry.conv.debug.isB}` : entry.conv.error)}</div>
  `;
  return div;
}

function render(){
  const out = document.getElementById("out");
  const resultsArea = document.getElementById("resultsArea");
  out.innerHTML = "";
  resultsArea.hidden = true;

  if (!dictionary){
    out.innerHTML = '<div class="status warn">DBが未読み込みです。</div>';
    return;
  }

  const input = document.getElementById("q").value.trim();
  if (!input) return;

  const chars = Array.from(input).filter(core.isCjkIdeograph);
  if (chars.length === 0) return;

  resultsArea.hidden = false;

  for (const ch of chars){
    const hits = core.getCharacterEntries(dictionary, ch);
    const block = document.createElement("div");
    block.className = "charBlock";

    const title = document.createElement("div");
    title.className = "charTitle";
    title.innerHTML = `<div class="han">${core.escapeHtml(ch)}</div><div class="meta">一致件数：${hits.length}</div>`;
    block.appendChild(title);

    if (!hits.length){
      const empty = document.createElement("div");
      empty.className = "status warn";
      empty.textContent = "該当なし";
      block.appendChild(empty);
      out.appendChild(block);
      continue;
    }

    hits.forEach((entry, index) => {
      block.appendChild(renderCharEntry(entry, index));
    });

    out.appendChild(block);
  }
}

async function loadDictionary(rawUrl = DEFAULT_SOURCE_URL){
  try {
    setStatus(`取得中… ${core.normalizeTextUrl(rawUrl)}`, "warn");
    const result = await core.loadDictionaryFromUrl(rawUrl);
    dictionary = result.dictionary;
    window.HuToolDemos?.start(dictionary);
    setStatus(
      "読み込み完了",
      dictionary.stats.missingCount ? "warn" : "ok"
    );
    render();
  } catch (error) {
    setStatus(`取得失敗：${String(error)}`, "bad");
  }
}

document.getElementById("searchBtn").addEventListener("click", render);
document.getElementById("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter") render();
});
document.getElementById("demoBtn").addEventListener("click", () => {
  document.getElementById("q").value = "春眠不覺曉";
  render();
});

window.addEventListener("DOMContentLoaded", () => {
  loadDictionary();
});
</script>
</body>
</html>
